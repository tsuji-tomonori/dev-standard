name: Benchmark Conformance

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths:
      - "benchmarks/**"
      - "tests/benchmark/**"
      - "spec/requirements/**"
      - "docs/requirements/**"
      - "docs/decisions/ADR-0003-skills-e2e-benchmark.md"
      - "distribution/manifest.json"
      - ".github/workflows/benchmark-*.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate network namespace isolation
        run: python -m benchmarks.harness.sandbox --probe-network
      - name: Check benchmark certification cases
        run: python -m benchmarks.harness.certify --root . --check
      - name: Run benchmark contract tests
        run: python -m unittest discover -s tests/benchmark -v
