name: Governance

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure
      - run: python tools/devflow.py catalog --check
      - run: python .agents/skills/maintain-canonical-requirements/scripts/specflow.py check
      - run: python .agents/skills/verify-against-engineering-standards/scripts/standardsflow.py check
      - run: ruff check .
      - name: Validate main Commit Comment
        if: github.event_name == 'push' && github.ref_name == 'main'
        shell: bash
        run: |
          validator="$RUNNER_TEMP/review-validate.py"
          before="$(jq -r .before "$GITHUB_EVENT_PATH")"
          if [[ "$before" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$before:governance/reviews/validate.py" 2>/dev/null; then
            git show "$before:governance/reviews/validate.py" > "$validator"
          else
            cp governance/reviews/validate.py "$validator"
          fi
          python "$validator" --root . --commit HEAD
      - name: Run unit tests
        id: unit-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests > unit-test.log 2>&1
          status=$?
          cat unit-test.log
          exit "$status"
      - name: Upload unit test log on failure
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          path: unit-test.log
          archive: false
          retention-days: 3
      - name: Run repository validation
        id: repository-validation
        if: always()
        shell: bash
        run: |
          set +e
          python tools/validate_repo.py > repository-validation.log 2>&1
          status=$?
          cat repository-validation.log
          exit "$status"
      - name: Upload repository validation log on failure
        if: failure() && steps.repository-validation.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          path: repository-validation.log
          archive: false
          retention-days: 3
      - name: Run regulated audit
        if: success()
        run: python tools/devflow.py audit

  evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch protected branch refs
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Select governing validators
        id: governing
        shell: bash
        run: |
          base="$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH")"
          policy="$RUNNER_TEMP/branch-policy.py"
          review="$RUNNER_TEMP/review-validate.py"
          requirements="$RUNNER_TEMP/review-requirements.txt"
          for item in \
            "tools/branch_policy.py:$policy" \
            "governance/reviews/validate.py:$review" \
            "governance/reviews/requirements.txt:$requirements"; do
            source="${item%%:*}"
            target="${item#*:}"
            if git cat-file -e "$base:$source" 2>/dev/null; then
              git show "$base:$source" > "$target"
            else
              cp "$source" "$target"
            fi
          done
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          echo "review=$review" >> "$GITHUB_OUTPUT"
          echo "requirements=$requirements" >> "$GITHUB_OUTPUT"
      - run: pip install -r "${{ steps.governing.outputs.requirements }}"
      - name: Validate PR head policy
        id: policy
        run: >-
          python "${{ steps.governing.outputs.policy }}" --root . pull-request
          --event-path "$GITHUB_EVENT_PATH"
          --checkout head
          --github-output "$GITHUB_OUTPUT"
      - name: Validate topic Commit Comment and review
        if: steps.policy.outputs.evidence_commit != ''
        run: >-
          python "${{ steps.governing.outputs.review }}" --root .
          --commit "${{ steps.policy.outputs.evidence_commit }}"
      - name: Validate release review
        if: steps.policy.outputs.review_path != ''
        run: >-
          python "${{ steps.governing.outputs.review }}" --root .
          --review "${{ steps.policy.outputs.review_path }}"
          --source-commit "${{ steps.policy.outputs.review_commit }}"
          --require-squash

  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch protected branch refs
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Select governing validators
        id: governing
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            governing="$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH")"
          else
            governing="$(jq -r .before "$GITHUB_EVENT_PATH")"
          fi
          policy="$RUNNER_TEMP/branch-policy.py"
          review="$RUNNER_TEMP/review-validate.py"
          requirements="$RUNNER_TEMP/review-requirements.txt"
          for item in \
            "tools/branch_policy.py:$policy" \
            "governance/reviews/validate.py:$review" \
            "governance/reviews/requirements.txt:$requirements"; do
            source="${item%%:*}"
            target="${item#*:}"
            if [[ "$governing" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "$governing:$source" 2>/dev/null; then
              git show "$governing:$source" > "$target"
            else
              cp "$source" "$target"
            fi
          done
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          echo "review=$review" >> "$GITHUB_OUTPUT"
          echo "requirements=$requirements" >> "$GITHUB_OUTPUT"
      - run: pip install -r "${{ steps.governing.outputs.requirements }}"
      - name: Validate branch topology and direction
        id: policy
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python "${{ steps.governing.outputs.policy }}" --root . pull-request \
              --event-path "$GITHUB_EVENT_PATH" \
              --checkout integration \
              --github-output "$GITHUB_OUTPUT"
          else
            python "${{ steps.governing.outputs.policy }}" --root . push \
              --event-path "$GITHUB_EVENT_PATH" \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Validate merged topic evidence
        if: github.event_name == 'push' && steps.policy.outputs.kind == 'topic'
        run: >-
          python "${{ steps.governing.outputs.review }}" --root .
          --commit "${{ steps.policy.outputs.evidence_commit }}"

  verify:
    if: always()
    needs: [integration, evidence, branch-policy]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the bootstrap required-check context
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
        shell: bash
        run: |
          [[ "$INTEGRATION_RESULT" == "success" ]]
          [[ "$BRANCH_POLICY_RESULT" == "success" ]]
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$EVIDENCE_RESULT" == "success" ]]
          else
            [[ "$EVIDENCE_RESULT" == "skipped" || "$EVIDENCE_RESULT" == "success" ]]
          fi

  pr34-migration-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/diagnose-pr34-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Rebase original benchmark commits onto current dev
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/agent/issue-22-e2e-benchmark:refs/remotes/origin/agent/issue-22-e2e-benchmark
          git switch -C migrated 6d1b74e3425b8bbfad2b165cfa21eae5dec3ebb5
          set +e
          git rebase --onto origin/dev 8174ec455e7062e5a7eb45f91d2fba60aafc7fcb
          status=$?
          set -e
          mkdir -p .diagnostic/conflicts
          printf '%s\n' "$status" > .diagnostic/rebase-status.txt
          git status --short > .diagnostic/git-status.txt
          git diff --name-only --diff-filter=U > .diagnostic/conflict-paths.txt
          git log --oneline --decorate -12 > .diagnostic/log.txt || true
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            safe="${path//\//__}"
            git show ":1:$path" > ".diagnostic/conflicts/${safe}.base" 2>/dev/null || true
            git show ":2:$path" > ".diagnostic/conflicts/${safe}.ours" 2>/dev/null || true
            git show ":3:$path" > ".diagnostic/conflicts/${safe}.theirs" 2>/dev/null || true
            cp "$path" ".diagnostic/conflicts/${safe}.worktree" 2>/dev/null || true
          done < .diagnostic/conflict-paths.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pr34-migration-diagnostic
          path: .diagnostic
          if-no-files-found: error
          retention-days: 1
