name: Main Snapshot Once

on:
  push:
    branches: [agent/main-snapshot-20260725]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create repository snapshot
        run: tar --exclude=.git -czf /tmp/main-snapshot.tar.gz .
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v7
        with:
          name: main-snapshot
          path: /tmp/main-snapshot.tar.gz
          archive: false
          retention-days: 1
