residual_risks:
- GitHub rulesetはこのPRのrepository差分だけでは適用されないため、merge後にmainとdevへ設定し確認するまで試行を開始しない
- 最終squash commitはmerge時に生成されるためPR required checkでは事前保証できず、main push auditは事後検出になる
- required checkはcross-branchの原子的lockではないため、試行中は単一release operatorと明示freezeを維持する
- pull_request workflow file自体は候補差分から実行され得るためtamper-proofではなく、workflow変更は単一operatorが差分とGitHub
  Actions由来checkを確認する
- 詳細commitをdevから保持するため、次回release PRのcommit一覧には過去releaseの詳細commitが残り得る
- GitHub Actionsの外部結果はPR公開後の現在HEADで確認する必要がある
- mainにbranch policyが未導入の間はbase側review validatorがrelease専用CLIを持たないため、初回main導入はdevを包含するmain-first
  bootstrap branchとして検証する
