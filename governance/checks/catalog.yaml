schema_version: 1
catalog_version: 3
authority: governance/checks/catalog.yaml
initial_import: dev-standard_checklist_restructured.xlsx の 01_必要チェック
item_count: 42
portable_default_selection: []
current_namespaces:
- IMP
- FAST
- AUD
historical_namespaces:
- REV
- MRG
- DEP
policy_boundary: portable Skillは変更と受入条件に関係するIMP・FASTだけを明示選択できる。catalog自体、過去のREV・MRG・DEP、CI、branch、merge、commit、review方式は選択を発生させず、導入先が既に所有する規則を変更しない
items:
- id: IMP-001
  class: Invariant
  timing: impact
  area: Impact
  trigger: 常時
  check: 要件影響を判定する
  acceptance: 利用者向け挙動、業務ルール、受入条件、非機能閾値、権限要件の変更有無を判定する。Fail条件「要件影響が未判定」に該当しない
  required_evidence: requirements.qntのdeltaまたは要件影響なしの簡潔な理由
  enforcement: blocking
  execution_point: 実装開始前
- id: IMP-002
  class: Invariant
  timing: impact
  area: Impact
  trigger: 常時
  check: 設計影響を判定する
  acceptance: 生成設計、ADR、公開契約、データモデル、構成の変更有無を判定する。Fail条件「設計影響が未判定」に該当しない
  required_evidence: 生成設計・ADRのdeltaまたは設計影響なしの簡潔な理由
  enforcement: blocking
  execution_point: 実装開始前
- id: IMP-003
  class: Advisory
  timing: impact
  area: Impact
  trigger: 運用影響時
  check: 必要な場合だけ実行範囲を調整する
  acceptance: 検証範囲が既に明確なら追加profileを作らない。不明な場合はscope、assurance、compute、modeを独立に選び、CI・branch・merge・commit方式を選択結果に含めない
  required_evidence: 会話またはローカルsummaryの選択理由
  enforcement: advisory
  execution_point: 検証範囲が不明な場合
- id: IMP-004
  class: Invariant
  timing: impact
  area: Authority
  trigger: 外部書込み時
  check: 外部書込みを識別する
  acceptance: GitHub、クラウド、外部API、通知、公開先への書込みを列挙する。Fail条件「未承認の外部書込みがある」に該当しない
  required_evidence: 操作前の会話または対象repository既存記録
  enforcement: blocking
  execution_point: 外部操作前
- id: IMP-005
  class: Invariant
  timing: impact
  area: Authority
  trigger: 不可逆操作時
  check: 不可逆操作を識別する
  acceptance: 削除、データ変換、production変更、課金、公開、mergeを判定する。Fail条件「権限境界が不明」に該当しない
  required_evidence: 操作を特定する依頼または明示承認
  enforcement: blocking
  execution_point: 不可逆操作前
- id: IMP-006
  class: Invariant
  timing: impact
  area: Security
  trigger: 認証・認可変更時
  check: 認証・認可影響を識別する
  acceptance: 認証方式、権限、テナント境界、最小権限への影響を判定し、変更に関係する認証・認可checkを選択する。Fail条件「高影響の認証・認可変更が未検証」に該当しない
  required_evidence: selected_checksと対象テスト
  enforcement: blocking
  execution_point: 実装開始前
- id: IMP-007
  class: Risk-selected
  timing: impact
  area: Data
  trigger: DB・永続データ変更時
  check: データ変更を識別する
  acceptance: schema、migration、削除、互換性、rollbackの必要性を判定する。Fail条件「migration検証が未選択」に該当しない
  required_evidence: selected_checks
  enforcement: blocking-when-selected
  execution_point: 実装開始前
- id: IMP-008
  class: Risk-selected
  timing: impact
  area: Contract
  trigger: 公開API・イベント変更時
  check: 公開契約影響を識別する
  acceptance: OpenAPI、イベント、CLI、ファイル形式、外部利用者への互換性を判定する。Fail条件「契約差分検証が未選択」に該当しない
  required_evidence: selected_checks
  enforcement: blocking-when-selected
  execution_point: 実装開始前
- id: IMP-009
  class: Risk-selected
  timing: impact
  area: Infrastructure
  trigger: IaC変更時
  check: IaC影響を識別する
  acceptance: resource、権限、network、削除・置換、費用への影響を判定する。Fail条件「synth/diff検証が未選択」に該当しない
  required_evidence: selected_checks
  enforcement: blocking-when-selected
  execution_point: 実装開始前
- id: IMP-010
  class: Risk-selected
  timing: impact
  area: Dependency
  trigger: 依存更新時
  check: 依存変更を識別する
  acceptance: lockfile、license、脆弱性、破壊的変更、transitive dependencyを判定する。Fail条件「依存検証が未選択」に該当しない
  required_evidence: selected_checks
  enforcement: blocking-when-selected
  execution_point: 実装開始前
- id: FAST-001
  class: Invariant
  timing: implementation
  area: Build
  trigger: コード変更時
  check: 構文・ビルドを確認する
  acceptance: 対象言語・対象モジュールの最小ビルドまたは構文検査を実行する。Fail条件「ビルド不能」に該当しない
  required_evidence: ローカル実行結果または対象repositoryが既に所有するcheck
  enforcement: blocking
  execution_point: 各実装スライス後
- id: FAST-002
  class: Invariant
  timing: implementation
  area: Static
  trigger: 型付きコード変更時
  check: 型検査を実行する
  acceptance: 変更範囲に対応するtype checkを実行する。Fail条件「型エラー」に該当しない
  required_evidence: ローカル実行結果または対象repositoryが既に所有するcheck
  enforcement: blocking
  execution_point: 各実装スライス後
- id: FAST-003
  class: Invariant
  timing: implementation
  area: Static
  trigger: コード変更時
  check: 対象lintを実行する
  acceptance: 変更ファイルまたは関連モジュールへlintを実行する。Fail条件「blocking lint」に該当しない
  required_evidence: ローカル実行結果または対象repositoryが既に所有するcheck
  enforcement: blocking
  execution_point: 各実装スライス後
- id: FAST-004
  class: Invariant
  timing: implementation
  area: Test
  trigger: 振る舞い変更時
  check: 対象単体テストを実行する
  acceptance: 変更した振る舞いと失敗経路を直接検証する。Fail条件「対象テスト失敗」に該当しない
  required_evidence: ローカル実行結果または対象repositoryが既に所有するcheck
  enforcement: blocking
  execution_point: 各実装スライス後
- id: FAST-005
  class: Risk-selected
  timing: implementation
  area: Test
  trigger: 不具合修正時
  check: 再現テストを確認する
  acceptance: 修正前に失敗する条件をテストまたは再現手順で固定する。Fail条件「不具合再発を検出できない」に該当しない
  required_evidence: テストコードと選択した実行結果
  enforcement: blocking-when-selected
  execution_point: 修正確定前
- id: FAST-006
  class: Invariant
  timing: implementation
  area: Generated
  trigger: 生成対象変更時
  check: 生成物driftを検査する
  acceptance: 宣言済み生成対象を同一logicのgenerate/check modeで決定論的に再生成し、差分pathを列挙する。Fail条件「生成元との不一致または非決定出力」に該当しない
  required_evidence: 生成物とローカルまたは対象repository既存checkの結果
  enforcement: blocking
  execution_point: 生成元変更後
- id: FAST-007
  class: Invariant
  timing: implementation
  area: Security
  trigger: 全変更
  check: 秘密情報混入を検査する
  acceptance: credential、token、個人情報、production dumpをGitへ追加していないことを検査する。Fail条件「秘密情報または機密データ」に該当しない
  required_evidence: secret scan / staged diff
  enforcement: blocking
  execution_point: commit前
- id: FAST-008
  class: Risk-selected
  timing: implementation
  area: Dependency
  trigger: 依存更新時
  check: lock整合性を検査する
  acceptance: manifestとlockfile、解決結果、不要依存の混入を検査する。Fail条件「lock不整合」に該当しない
  required_evidence: ローカルまたは対象repository既存checkの結果
  enforcement: blocking-when-selected
  execution_point: 依存更新後
- id: FAST-009
  class: Risk-selected
  timing: implementation
  area: API
  trigger: 公開API変更時
  check: 契約差分を検査する
  acceptance: OpenAPIまたはschemaのbreaking changeを機械比較する。Fail条件「未承認のbreaking change」に該当しない
  required_evidence: contract差分と選択した実行結果
  enforcement: blocking-when-selected
  execution_point: API変更後
- id: FAST-010
  class: Risk-selected
  timing: implementation
  area: Database
  trigger: SQL変更時
  check: SQLを構文解析する
  acceptance: 生SQLをASTで解析し、対象テーブルと操作を確認する。Fail条件「未解析SQL」に該当しない
  required_evidence: parserのローカルまたは対象repository既存check結果
  enforcement: blocking-when-selected
  execution_point: SQL変更後
- id: FAST-011
  class: Risk-selected
  timing: implementation
  area: Database
  trigger: migration時
  check: migration往復を検査する
  acceptance: forward、rollbackまたは復旧手順、既存データ互換性を確認する。Fail条件「データ損失・復旧不能」に該当しない
  required_evidence: migrationの選択した実行結果
  enforcement: blocking-when-selected
  execution_point: migration変更後
- id: FAST-012
  class: Risk-selected
  timing: implementation
  area: IaC
  trigger: IaC変更時
  check: synthと差分を検査する
  acceptance: 生成template、resource replacement、permission、network差分を確認する。Fail条件「未意図の置換・削除」に該当しない
  required_evidence: synth・diffのローカルまたは対象repository既存check結果
  enforcement: blocking-when-selected
  execution_point: IaC変更後
- id: FAST-013
  class: Risk-selected
  timing: implementation
  area: Frontend
  trigger: UI変更時
  check: 主要状態を実装する
  acceptance: loading、empty、error、permission、success、recoveryの適用状態を確認する。Fail条件「重要状態の欠落」に該当しない
  required_evidence: component/E2E test
  enforcement: blocking-when-selected
  execution_point: UIスライス完了時
- id: FAST-014
  class: Risk-selected
  timing: implementation
  area: Accessibility
  trigger: 対話UI変更時
  check: キーボード・意味構造を確認する
  acceptance: semantic element、accessible name、focus、keyboard、reduced motionを確認する。Fail条件「重要操作が利用不能」に該当しない
  required_evidence: component test / review
  enforcement: blocking-when-selected
  execution_point: UIスライス完了時
- id: FAST-015
  class: Advisory
  timing: implementation
  area: Observability
  trigger: 運用影響時
  check: 観測可能性を確認する
  acceptance: 失敗が検知可能で、必要なlog・metric・traceがあることを確認する。Fail条件「運用時の診断性低下」に該当しない
  required_evidence: テストまたは設計差分
  enforcement: advisory
  execution_point: 関連実装後
- id: FAST-016
  class: Risk-selected
  timing: implementation
  area: As-built API
  trigger: 公開API変更時
  check: 実装・仕様・sampleの三点整合を検査する
  acceptance: handler登録、設計metadata、error分岐、error sampleを静的解析する。Fail条件「登録漏れ、metadata欠落、sample不足」に該当しない
  required_evidence: 選択したstatic check結果
  enforcement: blocking-when-selected
  execution_point: API・OpenAPI・sample変更後
- id: FAST-017
  class: Risk-selected
  timing: implementation
  area: As-built Sample
  trigger: 公開API変更時
  check: sampleとtestの整合を検査する
  acceptance: 設計掲載sampleが対応testから参照され、branch-awareで再代入時に失効するprovenanceにより実responseとのassertに使われることをASTで確認する。明示adapterはauthority IDと認識済みruntime client呼出を持つ場合だけ信頼する。Fail条件「未testまたはfabricated responseのsample」に該当しない
  required_evidence: static check / test code / 選択した実行結果
  enforcement: blocking-when-selected
  execution_point: API sample変更後
- id: FAST-018
  class: Risk-selected
  timing: implementation
  area: As-built E2E
  trigger: SQLまたはE2E変更時
  check: CRUDとE2E状態検証の整合を検査する
  acceptance: C/U/D APIの正常系E2EがDBまたは外部状態を検証し、異常系が状態不変または理由付き許可変化を検証する。Fail条件「状態assert欠落」に該当しない
  required_evidence: static check / E2E test / 選択した実行結果
  enforcement: blocking-when-selected
  execution_point: SQL・CRUD・E2E変更後
- id: FAST-019
  class: Advisory
  timing: implementation
  area: As-built Coverage
  trigger: as-built規約適用時
  check: C0・C1 coverage目標を測定する
  acceptance: C0命令網羅95%以上、C1分岐網羅90%以上を測定し、未達を導入時のAdvisoryとして報告する。Fail条件「測定不能または目標未達」に該当しない
  required_evidence: 選択したcoverage result
  enforcement: advisory
  execution_point: as-built規約の導入・拡張後
- id: FAST-020
  class: Advisory
  timing: implementation
  area: As-built Test Structure
  trigger: as-built規約適用時
  check: AAA・GWTとtest記述規約を評価する
  acceptance: unit testのAAA、E2EのGWT、docstring、1 case 1関数をASTで評価する。Fail条件「生成可能なtest構造を満たさない」に該当しない
  required_evidence: static check / test code
  enforcement: advisory
  execution_point: as-built規約の導入・拡張後
- id: FAST-021
  class: Advisory
  timing: implementation
  area: As-built Implementation
  trigger: as-built規約適用時
  check: 解析可能な実装規約を評価する
  acceptance: endpoint layout、layer分離、生SQL、運用log、generator tool構造を評価する。Fail条件「静的解析でflowまたは一次情報を追跡できない」に該当しない
  required_evidence: static check / design review
  enforcement: advisory
  execution_point: as-built規約の導入・拡張後
- id: FAST-022
  class: Risk-selected
  timing: implementation
  area: As-built Thresholds
  trigger: 定量閾値変更時
  check: 規約・設定・委譲先の定量値を一致させる
  acceptance: 標準Rule ID、machine-readable設定、linter delegationの閾値を比較する。Fail条件「値または委譲mappingの不一致」に該当しない
  required_evidence: standard / config / static check
  enforcement: blocking-when-selected
  execution_point: 閾値またはlinter設定変更後
- id: FAST-023
  class: Advisory
  timing: implementation
  area: As-built Evidence
  trigger: as-built規約適用時
  check: 品質結果を簡潔なsummaryへ集約する
  acceptance: as-built executorは個別結果をstdoutへ返し、選択したtest、static analysis、規約check、coverageのローカルsummary集約をinspect-quality-gatesへ一本化する。対象repositoryが既に所有するreport viewがある場合だけそこへ提示できる。新しいCIや外部report基盤を要求せず、repositoryへ生ログ本文を保存しない
  required_evidence: local summary / target-owned existing report view / artifact policy
  enforcement: advisory
  execution_point: as-built規約の導入・拡張後
- id: FAST-024
  class: Risk-selected
  timing: implementation
  area: As-built Contract
  trigger: as-built標準・generator・配布contract変更時
  check: as-built標準の正本・配布契約・traceを整合させる
  acceptance: 要件正本、標準文書、check catalog、generator contract、配布定義、Rule・check・test traceの変更が相互整合し、第二正本を作らない。Fail条件「標準contract間の不一致または回帰test欠落」に該当しない
  required_evidence: standard / catalog / contract test / distribution test
  enforcement: blocking-when-selected
  execution_point: as-built標準・catalog・generator・配布contract変更後
- id: AUD-001
  class: Periodic
  timing: periodic
  area: Checklist
  trigger: 月次またはリリース単位
  check: false blockerを分析する
  acceptance: 品質欠陥を防がず作業だけを止めたチェックを特定する。Fail条件「手続きの自己目的化」に該当しない
  required_evidence: audit report / issue
  enforcement: periodic
  execution_point: 月次
- id: AUD-002
  class: Periodic
  timing: periodic
  area: Checklist
  trigger: 月次またはリリース単位
  check: 見逃しを分析する
  acceptance: escaped defectから不足チェック、selector miss、証拠不足を特定する。Fail条件「重要チェック不足」に該当しない
  required_evidence: incident / defect data
  enforcement: periodic
  execution_point: 月次
- id: AUD-003
  class: Periodic
  timing: periodic
  area: Skills
  trigger: 月次
  check: Skill競合を分析する
  acceptance: 重複指示、相反ルール、不要な自動起動、hook再注入を確認する。Fail条件「LLM活動阻害」に該当しない
  required_evidence: instruction audit
  enforcement: periodic
  execution_point: 月次
- id: AUD-004
  class: Periodic
  timing: periodic
  area: Efficiency
  trigger: 月次
  check: 実行コストを分析する
  acceptance: tool call、read bytes、質問数、reviewer数、選択checkの再試行を集計する。Fail条件「過剰統制」に該当しない
  required_evidence: external telemetry
  enforcement: periodic
  execution_point: 月次
- id: AUD-005
  class: Periodic
  timing: periodic
  area: Standards
  trigger: 再確認期限時
  check: 標準出典を更新する
  acceptance: 公式資料の版・適用範囲・差分を確認する。Fail条件「陳腐化した参照」に該当しない
  required_evidence: standards registry
  enforcement: periodic
  execution_point: 期限到来時
- id: AUD-006
  class: Periodic
  timing: periodic
  area: Artifacts
  trigger: 月次
  check: 不要成果物を検出する
  acceptance: 生成されるが参照されない文書、孤立trace、古い一時ファイルを確認する。Fail条件「情報量だけ増加」に該当しない
  required_evidence: repository audit
  enforcement: periodic
  execution_point: 月次
- id: AUD-007
  class: Periodic
  timing: periodic
  area: Reviews
  trigger: 月次
  check: advisory滞留を確認する
  acceptance: 対象repositoryの既存記録またはローカルsummaryから、同一advisoryの反復と未処理riskを確認する。新しいIssueやreview YAMLを要求しない
  required_evidence: local summary / target-owned existing backlog
  enforcement: periodic
  execution_point: 月次
- id: AUD-008
  class: Periodic
  timing: periodic
  area: Suppressions
  trigger: 月次
  check: Rule ID抑制一覧を監査する
  acceptance: ignore[Rule ID]のpath、理由、重複、失効、孤児を確認する。Fail条件「理由なし抑制または恒久化した不要抑制」に該当しない
  required_evidence: suppression inventory / audit report
  enforcement: periodic
  execution_point: 月次
